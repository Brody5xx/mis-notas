# 🛠️ Construye Best Notes (APK) gratis en GitHub, sin usar el límite de Expo.
# Usa tu proyecto de Replit (rama "proyecto") + los últimos cambios de la app (rama "main").
# El APK queda en: https://github.com/Brody5xx/mis-notas/releases/download/apk/best-notes.apk
name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, proyecto]
    paths-ignore: ['README.md', 'eliminar.txt']
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Traer tu proyecto de Replit
        uses: actions/checkout@v4
        with:
          ref: proyecto
          path: workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar pnpm (la misma versión que Replit)
        run: |
          V=$(node -e "try{console.log(require('./workspace/artifacts/mobile/eas.json').build.apk.pnpm||'')}catch(e){console.log('')}")
          npm i -g pnpm@${V:-10} eas-cli
      - name: Instalar las piezas
        working-directory: workspace
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Poner la última versión de Best Notes
        run: |
          export HOME="$GITHUB_WORKSPACE"
          curl -fsSL "https://raw.githubusercontent.com/Brody5xx/mis-notas/main/actualizar.sh?$(date +%s)" -o /tmp/actualizar.sh
          sh /tmp/actualizar.sh
      - name: Guardar los cambios (para que Expo los use)
        working-directory: workspace
        run: |
          git config user.name "Best Notes"; git config user.email "bestnotes@users.noreply.github.com"
          git add -A; git commit -qm "Best Notes al día" || true
      - name: Construir el APK
        working-directory: workspace/artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "Falta el secreto EXPO_TOKEN en GitHub (Settings > Secrets > Actions)"; exit 1; fi
          eas build -p android --profile apk --local --non-interactive --output "$GITHUB_WORKSPACE/best-notes.apk"
      - name: Publicar el APK para descargarlo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create apk "$GITHUB_WORKSPACE/best-notes.apk" -R "$GITHUB_REPOSITORY" --target main \
            --title "Best Notes — última versión" --notes "Construido el $(date -u '+%Y-%m-%d %H:%M') UTC. Descarga best-notes.apk e instálalo encima."
